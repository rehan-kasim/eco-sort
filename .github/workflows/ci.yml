name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # API smoke test (skips the live Gemini call when no key is configured)
      - run: node scripts/smoke.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
